<div class="research-loader" id="research-loader" role="status" aria-live="polite" aria-hidden="true" tabindex="-1">
  <!-- The docking animation and the title stand inside the progress ring rather
       than above a bar: one dial, read from the middle out. -->
  <div class="research-loader-dial">
    <svg class="research-loader-ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="research-loader-track" cx="50" cy="50" r="49"/>
      <!-- pathLength 1 puts the dash and the offset in fractions of a full
           turn, so one dash covers the ring and the offset reads straight off
           as how much of it is still to fill, whatever the radius. -->
      <circle class="research-loader-arc" cx="50" cy="50" r="49" pathLength="1"/>
    </svg>
    <div class="research-loader-core" aria-hidden="true">
      <canvas class="loader-docking" data-pocket-src="{{ '/assets/img/research/loader-protein-pocket.png' | relative_url }}" width="560" height="400" aria-hidden="true"></canvas>
    </div>
    <p class="research-loader-label">Research vision</p>
  </div>
  <span class="research-loader-sr">Loading research page</span>
</div>
