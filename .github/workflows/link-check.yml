name: Link check

# The site is almost entirely links - papers, co-authors, labs, code - and they
# rot from the other end, without a commit here. So: on every push, and once a
# week regardless.
on:
  push:
  schedule:
    # 23:00 UTC Sunday is 08:00 Monday in Seoul, which is where this is read.
    - cron: "0 23 * * 0"

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The same build the deploy workflow runs.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Two things have to be squared away before anything can read the output.
      #
      # jekyll-build-pages runs in a container as root, so _site comes back owned
      # by root and the next step - running as `runner` - cannot write to it.
      #
      # And it applies the project-page baseurl by itself, configure-pages or not:
      # every root-relative href in the output is /<repo>/..., not /... . Checked
      # against a root-dir of _site those all resolve to _site/<repo>/..., which
      # does not exist, and every local link fails at once. Staging the output
      # inside a directory of that name lines the paths up with what is deployed.
      - name: Take ownership, and stage the build under its baseurl
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _check
          mv _site "_check/${{ github.event.repository.name }}"

      # index.html keeps a long commented-out list of sites using this template.
      # Those links are not on the page, so they are not the page's problem -
      # strip comments from the built copy before checking it. The source is
      # untouched; only _site is edited, and only inside this run.
      - name: Drop commented-out markup
        run: |
          python3 - <<'PY'
          import re, pathlib
          for f in pathlib.Path('_check').rglob('*.html'):
              text = f.read_text(encoding='utf-8', errors='ignore')
              f.write_text(re.sub(r'<!--.*?-->', '', text, flags=re.S), encoding='utf-8')
          PY

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Hosts that block robots answer a live URL with 403 or LinkedIn's
          # own 999; treated as reachable, since the alternative is a red run
          # every week over links that are fine in a browser.
          #
          # No --exclude-mail: lychee 2 dropped it and skips mailto by default,
          # with --include-mail to opt back in. Passing it aborts the run before
          # a single link is checked.
          #
          # libs/external is vendored: those packages ship their own demo pages,
          # and this repo cannot fix a link inside one of them.
          #
          # resume/output is RenderCV's build product, not content written here -
          # its DOIs and CDN script tags are the generator's to get right, and a
          # dead DOI is not something a commit to this repo can fix. The glob
          # picks up the CV's HTML rendering; --exclude-path (a regex) drops it.
          #
          # Every page carries a canonical and an og:url pointing at its own
          # live address. Those pages are already checked here as files, and
          # fetching them over the network instead races the deploy: a page
          # added in this very push is not served yet, and answers 404. So the
          # site's own origin is excluded, local links are what gets verified.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_check
            --exclude-path resume/output/
            --exclude-path libs/external/
            --exclude '^https://seonghyun26\.github\.io/'
            --accept 200..=299,403,429,999
            --max-concurrency 8
            --max-retries 2
            --timeout 25
            --cache
            --max-cache-age 1d
            './_check/**/*.html'
          fail: true
          jobSummary: true
