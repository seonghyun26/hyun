# source:      .
# destination: ./_site
# includes:    ./_includes
# baseurl: /~hyun

# The project writeups and the screenshots they use sit together under
# _projects/<slug>/. Jekyll skips an underscored directory unless it is a
# collection, and a collection only copies its static files when it is output -
# so this is what puts the screenshots on the site, at /projects/<slug>/.
collections:
  projects:
    output: true

# Site origin, used by absolute_url (sitemap.xml, robots.txt).
# baseurl (/hyun) is injected at build time by actions/configure-pages.
url: "https://seonghyun26.github.io"

theme: minima

include:
  # Jekyll skips anything starting with "_", so the preprint assets would never
  # reach the build without this.
  - "_preprint_*"

exclude:
  # Local notes on how an image was generated; gitignored, and no business being
  # served next to the image either.
  - "assets/img/**/*-prompt.txt"
  # The writeups are pulled into the page by include_relative, which reads the
  # source tree - nothing links to them, so they need not also be served as raw
  # markdown next to the screenshots they sit with.
  - "_projects/*/*.md"
  - resume/.venv
  - resume/classic
  - resume/markdown
  - resume/resume
  - resume/rendercv_output
  - resume/make.sh
  - resume/environment.yml
  - resume/README.md
  - resume/templates
  - resume/resume.code-workspace
  - resume/Seonghyun_Park_CV.yaml
  - 2509_SeonghyunPark_resume.docx
  - Gemfile
  - Gemfile.lock
  - serve.sh
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - www_personal.code-workspace
