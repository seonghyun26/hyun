# source:      .
# destination: ./_site
# includes:    ./_includes
# baseurl: /~hyun

# collections:
#   projects:
#     output: true

# Site origin, used by absolute_url (sitemap.xml, robots.txt).
# baseurl (/hyun) is injected at build time by actions/configure-pages.
url: "https://seonghyun26.github.io"

theme: minima

exclude:
  # The project writeups are pulled into the page by include_relative, which reads
  # the source tree - nothing links to them, so they need not also be served as
  # raw markdown at /projects/*.md.
  - projects
  - resume/.venv
  - resume/classic
  - resume/markdown
  - resume/resume
  - resume/rendercv_output
  - resume/make.sh
  - resume/environment.yml
  - resume/README.md
  - resume/templates
  - resume/resume.code-workspace
  - resume/Seonghyun_Park_CV.yaml
  - 2509_SeonghyunPark_resume.docx
  - Gemfile
  - Gemfile.lock
  - serve.sh
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - www_personal.code-workspace
